name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # FLACのデコーダー (libFLAC) はサブモジュール
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # libFLAC (C) のコンパイル結果を、Actionsのキャッシュに保存して、次回から使い回す
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ccache-${{ runner.os }}-${{ hashFiles('decoder-flac/src/main/jni/CMakeLists.txt', 'decoder-flac/build.gradle.kts') }}
          max-size: 200M

      - name: Build, unit test, lint
        env:
          KANADE_CCACHE: "1"
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
